name = "aware-worker"
main = "src/index.ts"
compatibility_date = "2026-07-19"

[[durable_objects.bindings]]
name = "AWARE_HOST"
class_name = "AwareHost"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AwareHost"]

[vars]
AWARE_PHONE_KIDS = "phone-v1"
AWARE_HOST_KIDS = "host-v1"
AWARE_HOST_OFFLINE_SECONDS = "90"

# AWARE_HMAC_KEYS must be installed with `wrangler secret put AWARE_HMAC_KEYS`.
# It is a JSON object whose values are base64url-encoded 32-byte keys:
# {"phone-v1":"...","host-v1":"..."}
